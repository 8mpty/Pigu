plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

// Pigu's app version is independent of the Shizuku API/server version (13.6).
// Bump these three numbers for each Pigu release. Minor and patch must stay in 0..99.
def piguVersionMajor = 2
def piguVersionMinor = 1
def piguVersionPatch = 0
def piguVersionName = "${piguVersionMajor}.${piguVersionMinor}.${piguVersionPatch}"
def piguVersionCode = piguVersionMajor * 10000 + piguVersionMinor * 100 + piguVersionPatch
def isBeta = project.hasProperty("beta")
ext {
    versionCode = piguVersionCode
    versionName = "${piguVersionName}${if (isBeta) "-beta" else ""}"
}
